# Playbook: fuel pressure family (P0087/P0088) — the diesel workhorse. Doc 05
# §7: filter first (fuel quality on this market), leak-off lines second (the
# classic dCi return-network air ingress that starves the rail under load).
id: fuel_pressure_family
name_fr: "Pression rail insuffisante sous charge (P0087)"
triggers:
  dtcs: [P0087, P0088, P0090]
  flags: []
causes:
  - id: fuel_filter_clogged
    label_fr: "Filtre à carburant colmaté (qualité carburant locale — toujours d'abord)"
    base_prior: 0.38
    boosted_by: [trim_load_only]
    suppressed_by: []
    chips_boost: [under_load, power_loss]
    cards: [gauge_fuel_pressure, leak_off_inspection]
    fix:
      parts: [{ref: fuel_filter, qty: 1}]
      labor_h: 0.4
      procedure:
        - "La jauge vient de confirmer: pression rail basse (l'agent a comparé à la plage usine)."
        - "Remplacer le filtre — la pièce la moins chère de la liste, d'abord, toujours (doc 02 §4: tests par valeur discriminante/coût)."
        - "Amorcer correctement le circuit (pompe manuelle dCi), re-tester sous charge."
      post_repair_steps:
        - "Noter la périodicité de remplacement du filtre dans l'historique — sur ce marché, 10 000 km plutôt que 20 000."
  - id: leak_off_lines
    label_fr: "Prise d'air dans les durites de retour d'injecteurs (leak-off)"
    base_prior: 0.15
    boosted_by: []
    suppressed_by: []
    chips_boost: [under_load, hard_start]
    cards: [leak_off_inspection, gauge_fuel_pressure]
    fix:
      parts: [{ref: leak_off_hose_set, qty: 1}]
      labor_h: 0.6
      procedure:
        - "L'inspection vient de trouver des bulles dans les retours (l'agent l'a noté)."
        - "Remplacer le jeu de durites de retour; purger le circuit."
  - id: fuel_pump_weak
    label_fr: "Pompe à carburant faible (débit insuffisant sous forte demande)"
    base_prior: 0.15
    boosted_by: [voltage_low]
    suppressed_by: []
    chips_boost: [under_load, hard_start]
    cards: [gauge_fuel_pressure, electrical_load_test]
    fix:
      parts: [{ref: fuel_pump, qty: 1}]
      labor_h: 2.5
      procedure:
        - "Pression basse même à vide après filtre neuf et retours étanches → pompe."
        - "Vérifier d'abord l'alimentation électrique de la pompe (relais, masse)."
  - id: rail_pressure_sensor
    label_fr: "Capteur de pression rail qui ment (fausse alerte)"
    base_prior: 0.08
    boosted_by: []
    suppressed_by: []
    chips_boost: []
    cards: [wiggle_test]
    fix:
      parts: [{ref: rail_pressure_sensor, qty: 1}]
      labor_h: 0.6
      procedure:
        - "Comparaison capteur vs jauge externe (l'agent a les deux valeurs)."
        - "Divergence = capteur, pas d'alimentation réelle."
verification:
  drive_cycle: generic_obd2
  recheck_mode06: ["1_2"]
  note_fr: "Re-tester sous charge (côte/autoroute) après réparation — la trame de gel P0087 est toujours à haute charge: c'est là que ça doit tenir."
notes_fr: "Jamais de purge circuit ouverte près d'une source de chaleur; amorçage patient sur dCi (la pompe s'amorce mal à sec)."
