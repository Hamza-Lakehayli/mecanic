adapter: {chip: "ELM327 v1.5", max_poll_hz: 4}
vehicle:
  silent: true          # adapter powered (AT answered); every mode request = NO DATA
  vin: "UU1HSDC3456123999"
  ecus: {}
  baseline: {}
  readiness: {}
  dtcs: {stored: [], pending: [], permanent: []}
timeline:
  - {window: idle, duration_s: 30, values: {}}
complaint: {text: "", chips: []}
expected:
  root_cause: null
  status: escalate
  triage_contains: [ignition_off_suspect]
