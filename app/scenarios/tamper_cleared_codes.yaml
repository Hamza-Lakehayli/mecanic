  dtcs: {stored: [], pending: [], permanent: [P0171]}
  freeze_frame: null
  mode06:
    - {mid: 1, tid: 5, value: 63, min: 60, max: 100}
    - {mid: 1, tid: 2, value: 0.7, min: 0.2, max: 1.0}
