# Labeled CI scenario — tamper forensics (doc 17 §4.1): codes wiped before
# sale. Permanent P0171 survives, non-continuous monitors incomplete, no
# stored/pending codes, MIL off. The Rapport Confiance verdict: "effacement
# récent" + one monitor drifting. NO diagnostic verdict must be guessed.
name: tamper_cleared_codes
adapter: {chip: "ELM327 v1.5", max_poll_hz: 4}
vehicle:
  vin: "VF3UEAHZC98765432"
  decode: {make: Peugeot, model: 208, year: 2015, engine: "1.6 BlueHDi", fuel: diesel, displacement_l: 1.6}
  ecus: {7E8: ECM}
  baseline: {RPM: 800, LOAD: 20, ECT: 84, IAT: 27, MAF: 12.0, MAP: 30, SPEED: 0, TPS: 10, STFT_B1: 0, LTFT_B1: 0, O2_B1S1: 0.45, BATV: 14.0, EGR_ERR: 0}
