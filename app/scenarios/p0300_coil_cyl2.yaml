# cause confirmed by the swap test (the agent's test card).
name: p0300_coil_cyl2
adapter: {chip: "ELM327 v1.5", max_poll_hz: 4}
vehicle:
  vin: "VF1RFA00541234567"
  decode: {make: Renault, model: Megane, year: 2014, engine: "1.6 16v K4M", fuel: essence, displacement_l: 1.6}
  ecus: {7E8: ECM}
  baseline: {RPM: 760, LOAD: 21, ECT: 82, IAT: 28, MAF: 2.6, MAP: 31, SPEED: 0, TPS: 11, STFT_B1: 0, LTFT_B1: 1, O2_B1S1: 0.45, BATV: 13.9, EGR_ERR: 0}
